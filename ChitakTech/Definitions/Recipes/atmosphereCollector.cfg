////////////////////////////// atmosphereCollector Recipes //////////////////////////////

CHITAKTECHISRU_RECIPE:NEEDS[!SolSystem,!TheFiveEchoes]
{
    name = Collect Kerbin Air
    recipeType = atmosphereCollector
	recipeTime = 1

	PLANET_CONFIG
	{
		name = Kerbin
		BIOME_CONFIG
		{
			name = ALL

			situationOperating = Landed
			situationOperating = FlyingLow
		}
	}

	OUTPUT_MATERIAL
	{
		name = Air
		shape = Gas
		size = none
		outVolume = 1  // liters
		PARAMS
		{
			source = Kerbin
		}
	}
}
